[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeadmin"
version = "0.1.0"
description = "Stateful personal document and bill management agent benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
